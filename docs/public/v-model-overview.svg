<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="vm-title vm-desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" preserveAspectRatio="xMidYMid meet">
  <title id="vm-title">V-Model workflow for AI coding assistants</title>
  <desc id="vm-desc">Horizontal flow through Business Analysis, Requirements Engineering, Architecture, Coding, Testing, and Security Audit. Methods above each phase, artifacts below. Orange handoff arrows sit between every phase. Gray dashed fix loops connect Testing and Security Audit back to Coding. A teal dashed writeback loop shows living-documents updates from Coding back to earlier phases.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-fix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-writeback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- ==================== Methods row (3 lines per phase) ==================== -->
  <g font-size="16" fill="#6b7280" text-anchor="middle">
    <!-- BA -->
    <text x="110" y="22">Users · needs · market</text>
    <text x="110" y="42">JTBD · Hypotheses</text>
    <text x="110" y="62">Pricing · Viability</text>

    <!-- RE -->
    <text x="306" y="22">Epic hypothesis (from HMW)</text>
    <text x="306" y="42">User stories · Func/Emot/Social</text>
    <text x="306" y="62">Validation criteria</text>

    <!-- Arch -->
    <text x="502" y="22">ADR (MADR)</text>
    <text x="502" y="42">arc42</text>
    <text x="502" y="62">plan-context</text>

    <!-- Coding -->
    <text x="698" y="22">Codebase review</text>
    <text x="698" y="42">TDD · Debugging</text>
    <text x="698" y="62">Verification gate</text>

    <!-- Testing -->
    <text x="894" y="22">AAA · FIRST</text>
    <text x="894" y="42">Fix-loop</text>
    <text x="894" y="62">Coverage targets</text>

    <!-- Security -->
    <text x="1090" y="22">OWASP Top 10</text>
    <text x="1090" y="42">LLM · SAST · SCA</text>
    <text x="1090" y="62">Zero Trust</text>
  </g>

  <!-- ==================== Phase row (6 uniform boxes, h=120, y=80-200) ==================== -->

  <!-- Phase 1: Business Analysis (2-line label) -->
  <rect x="20" y="80" width="180" height="120" rx="14" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" font-size="26" font-weight="700" fill="#065f46">Business</text>
  <text x="110" y="152" text-anchor="middle" font-size="26" font-weight="700" fill="#065f46">Analysis</text>
  <text x="110" y="182" text-anchor="middle" font-size="15" fill="#047857">Why</text>

  <!-- Phase 2: Requirements Engineering (2-line label) -->
  <rect x="216" y="80" width="180" height="120" rx="14" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="306" y="120" text-anchor="middle" font-size="26" font-weight="700" fill="#065f46">Requirements</text>
  <text x="306" y="152" text-anchor="middle" font-size="26" font-weight="700" fill="#065f46">Engineering</text>
  <text x="306" y="182" text-anchor="middle" font-size="15" fill="#047857">What</text>

  <!-- Phase 3: Architecture (single line) -->
  <rect x="412" y="80" width="180" height="120" rx="14" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="502" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#065f46">Architecture</text>
  <text x="502" y="172" text-anchor="middle" font-size="15" fill="#047857">How</text>

  <!-- Phase 4: Coding (single line, default-agent slot) -->
  <rect x="608" y="80" width="180" height="120" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="698" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#374151">Coding</text>
  <text x="698" y="172" text-anchor="middle" font-size="15" fill="#6b7280">Enhanced default agent</text>

  <!-- Phase 5: Testing (single line) -->
  <rect x="804" y="80" width="180" height="120" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="894" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#5b21b6">Testing</text>
  <text x="894" y="172" text-anchor="middle" font-size="15" fill="#6d28d9">UT + IT</text>

  <!-- Phase 6: Security Audit (2-line label) -->
  <rect x="1000" y="80" width="180" height="120" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1090" y="120" text-anchor="middle" font-size="26" font-weight="700" fill="#991b1b">Security</text>
  <text x="1090" y="152" text-anchor="middle" font-size="26" font-weight="700" fill="#991b1b">Audit</text>
  <text x="1090" y="182" text-anchor="middle" font-size="15" fill="#b91c1c">OWASP · LLM · SCA</text>

  <!-- ==================== Main flow arrows (orange handoff at every transition) ==================== -->
  <line x1="202" y1="140" x2="214" y2="140" stroke="#f97316" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="398" y1="140" x2="410" y2="140" stroke="#f97316" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="594" y1="140" x2="606" y2="140" stroke="#f97316" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="790" y1="140" x2="802" y2="140" stroke="#f97316" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="986" y1="140" x2="998" y2="140" stroke="#f97316" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <!-- ==================== Phase-to-artifact connectors ==================== -->
  <line x1="110" y1="200" x2="110" y2="215" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="306" y1="200" x2="306" y2="215" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="502" y1="200" x2="502" y2="215" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="698" y1="200" x2="698" y2="215" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="894" y1="200" x2="894" y2="215" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="1090" y1="200" x2="1090" y2="215" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ==================== Artifact boxes (all 6 phases, 2 lines each) ==================== -->
  <rect x="30" y="215" width="160" height="65" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="110" y="241" text-anchor="middle" font-size="17" fill="#4b5563">BA doc</text>
  <text x="110" y="266" text-anchor="middle" font-size="17" fill="#4b5563">Exploration board</text>

  <rect x="226" y="215" width="160" height="65" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="306" y="241" text-anchor="middle" font-size="17" fill="#4b5563">Epics · Features</text>
  <text x="306" y="266" text-anchor="middle" font-size="17" fill="#4b5563">Backlog · Handoff</text>

  <rect x="422" y="215" width="160" height="65" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="502" y="241" text-anchor="middle" font-size="17" fill="#4b5563">ADRs · arc42</text>
  <text x="502" y="266" text-anchor="middle" font-size="17" fill="#4b5563">plan-context</text>

  <rect x="618" y="215" width="160" height="65" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="698" y="241" text-anchor="middle" font-size="17" fill="#4b5563">Source code</text>
  <text x="698" y="266" text-anchor="middle" font-size="17" fill="#4b5563">Bug log</text>

  <rect x="814" y="215" width="160" height="65" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="894" y="241" text-anchor="middle" font-size="17" fill="#4b5563">Test suites</text>
  <text x="894" y="266" text-anchor="middle" font-size="17" fill="#4b5563">Coverage</text>

  <rect x="1010" y="215" width="160" height="65" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="1090" y="241" text-anchor="middle" font-size="17" fill="#4b5563">Audit report</text>
  <text x="1090" y="266" text-anchor="middle" font-size="17" fill="#4b5563">Backlog updates</text>

  <!-- ==================== Fix and writeback loops (orthogonal, dashed) ==================== -->

  <!-- Test fix loop: Testing -> Coding (short U above the other loops) -->
  <path d="M 814 280 L 814 315 L 778 315 L 778 285" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-fix)"/>
  <text x="796" y="332" text-anchor="middle" font-size="15" font-style="italic" fill="#6b7280">Test fix loop</text>

  <!-- Security fix loop: Security Audit -> Coding (wider U below test loop) -->
  <path d="M 1010 280 L 1010 365 L 760 365 L 760 285" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-fix)"/>
  <text x="885" y="385" text-anchor="middle" font-size="15" font-style="italic" fill="#6b7280">Security fix loop</text>

  <!-- Living documents writeback: Coding -> Requirements / Architecture (teal U going left) -->
  <path d="M 618 280 L 618 420 L 386 420 L 386 285" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-writeback)"/>
  <text x="502" y="440" text-anchor="middle" font-size="15" font-style="italic" fill="#0d9488">Living documents writeback</text>

  <!-- ==================== Title + subtitle ==================== -->
  <text x="600" y="500" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">V-Model workflow for AI coding assistants</text>
  <text x="600" y="528" text-anchor="middle" font-size="15" fill="#6b7280">Methodology-driven discovery, enhanced coding loop, handoffs at every transition</text>
</svg>
