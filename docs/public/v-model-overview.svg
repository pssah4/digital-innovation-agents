<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 0 1530 590" role="img" aria-labelledby="vm-title vm-desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" preserveAspectRatio="xMidYMid meet">
  <title id="vm-title">V-Model workflow for AI coding assistants (DIA v3)</title>
  <desc id="vm-desc">Six phases in sequence: Business analysis, Requirements engineering, Architecture, Coding, Testing, Security audit. After Security audit, a Closing handoff runs a consistency check and emits a closing report; the release act itself is delegated to a project-specific skill. Two horizontal consistency buses run beneath the phase outputs: BACKLOG.md (status source of truth) that all six phases write into, and ARCHITECTURE.map (Wayfinder, code source of truth) that Coding writes and Architecture, Testing, Security audit read. Four dashed feedback loops show test fixes, mid-course discovery, security fixes, and living-documents writeback into the backlog.</desc>
  <defs>
    <marker id="arrow-handoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-wayfinder-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0e7490"/>
    </marker>
  </defs>

  <!-- Business Analysis -->
