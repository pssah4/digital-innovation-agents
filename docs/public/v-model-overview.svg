<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="vm-title vm-desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" preserveAspectRatio="xMidYMid meet">
  <title id="vm-title">V-Model workflow for Claude Code</title>
  <desc id="vm-desc">Horizontal flow from Business Analysis through Requirements, Architecture, Review Handoff, Claude Code implementation, Testing, and Security Audit. Each phase produces an artifact. Fix loops connect Claude Code with Testing and Security. Review sync connects Review back to Architecture.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ======================= Phase row ======================= -->

  <!-- Phase 1: BA (Design) -->
  <rect x="55" y="40" width="130" height="70" rx="10" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="120" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">BA</text>
  <text x="120" y="94" text-anchor="middle" font-size="13" fill="#047857">Why</text>

  <!-- Phase 2: RE (Design) -->
  <rect x="215" y="40" width="130" height="70" rx="10" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="280" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">RE</text>
  <text x="280" y="94" text-anchor="middle" font-size="13" fill="#047857">What</text>

  <!-- Phase 3: Arch (Design) -->
  <rect x="375" y="40" width="130" height="70" rx="10" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">Arch</text>
  <text x="440" y="94" text-anchor="middle" font-size="13" fill="#047857">How</text>

  <!-- Phase 4: Review (Handoff) -->
  <rect x="535" y="40" width="130" height="70" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Review</text>
  <text x="600" y="94" text-anchor="middle" font-size="13" fill="#c2410c">Handoff</text>

  <!-- Phase 5: Claude Code (Default agent) -->
  <rect x="695" y="40" width="130" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="760" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">Claude Code</text>
  <text x="760" y="90" text-anchor="middle" font-size="11" fill="#6b7280">Default agent</text>

  <!-- Phase 6: Testing (Verify) -->
  <rect x="855" y="40" width="130" height="70" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="920" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">Testing</text>
  <text x="920" y="92" text-anchor="middle" font-size="13" fill="#6d28d9">UT + IT</text>

  <!-- Phase 7: Security (Secure) -->
  <rect x="1015" y="40" width="130" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1080" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Security</text>
  <text x="1080" y="92" text-anchor="middle" font-size="13" fill="#b91c1c">Audit</text>

  <!-- ======================= Main flow arrows ======================= -->

  <line x1="185" y1="75" x2="213" y2="75" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="75" x2="373" y2="75" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="75" x2="533" y2="75" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="75" x2="693" y2="75" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="75" x2="853" y2="75" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="985" y1="75" x2="1013" y2="75" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ======================= Phase to artifact connectors ======================= -->

  <line x1="120" y1="110" x2="120" y2="133" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="280" y1="110" x2="280" y2="133" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="440" y1="110" x2="440" y2="133" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="920" y1="110" x2="920" y2="133" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="1080" y1="110" x2="1080" y2="133" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ======================= Artifact boxes ======================= -->

  <rect x="65" y="135" width="110" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="120" y="165" text-anchor="middle" font-size="12" fill="#4b5563">BA doc</text>

  <rect x="225" y="135" width="110" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="280" y="158" text-anchor="middle" font-size="12" fill="#4b5563">Features</text>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#4b5563">Handoff</text>

  <rect x="385" y="135" width="110" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="440" y="158" text-anchor="middle" font-size="12" fill="#4b5563">ADRs</text>
  <text x="440" y="174" text-anchor="middle" font-size="12" fill="#4b5563">plan-context</text>

  <rect x="865" y="135" width="110" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="920" y="165" text-anchor="middle" font-size="12" fill="#4b5563">Test suites</text>

  <rect x="1025" y="135" width="110" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="1080" y="165" text-anchor="middle" font-size="12" fill="#4b5563">Audit report</text>

  <!-- ======================= Fix loops (dashed curves) ======================= -->

  <!-- Review sync: Review (600) back to Arch (440), curving below -->
  <path d="M 600 110 Q 520 320 440 110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="520" y="255" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">Review sync</text>

  <!-- Test fix loop: Claude Code (760) to Testing (920) -->
  <path d="M 760 110 Q 840 285 920 110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="840" y="230" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">Test fix loop</text>

  <!-- Security fix loop: Claude Code (760) to Security (1080) -->
  <path d="M 760 110 Q 920 345 1080 110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="920" y="285" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">Security fix loop</text>

  <!-- ======================= Title + subtitle ======================= -->

  <text x="600" y="378" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">V-Model workflow for Claude Code</text>
  <text x="600" y="400" text-anchor="middle" font-size="12" fill="#6b7280">Structured AI skills from analysis to security audit, with fix loops and living documents</text>

  <!-- ======================= Legend ======================= -->

  <g font-size="11" fill="#374151">
    <rect x="135" y="435" width="14" height="14" rx="3" fill="#d1f4e8" stroke="#0d9488" stroke-width="1.5"/>
    <text x="155" y="446">Design</text>

    <rect x="235" y="435" width="14" height="14" rx="3" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="255" y="446">Handoff</text>

    <rect x="340" y="435" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="360" y="446">Default agent</text>

    <rect x="480" y="435" width="14" height="14" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="500" y="446">Verify</text>

    <rect x="570" y="435" width="14" height="14" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="590" y="446">Secure</text>

    <line x1="680" y1="442" x2="710" y2="442" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="716" y="446">Fix loops + artifact sync</text>
  </g>
</svg>
