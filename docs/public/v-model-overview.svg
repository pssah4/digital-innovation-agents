<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="vm-title vm-desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" preserveAspectRatio="xMidYMid meet">
  <title id="vm-title">V-Model workflow for Claude Code</title>
  <desc id="vm-desc">Horizontal V-Model flow with methods shown above each phase and artifacts produced below each phase. Phases: Business Analysis, Requirements Engineering, Architecture, Review Handoff, Coding, Testing, Security Audit. Dashed curves represent the fix loops and the review sync.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ======================= Methods row (above phases) ======================= -->
  <g font-size="10" fill="#6b7280" text-anchor="middle">
    <text x="120" y="22">Exploration · Ideation</text>
    <text x="120" y="36">Validation</text>

    <text x="280" y="22">Epics · Features</text>
    <text x="280" y="36">Tech-agnostic SC</text>

    <text x="440" y="22">ADR (MADR)</text>
    <text x="440" y="36">arc42 · plan-context</text>

    <text x="600" y="22">Codebase review</text>
    <text x="600" y="36">Artifact writeback</text>

    <text x="760" y="22">TDD · Debugging</text>
    <text x="760" y="36">Verification gate</text>

    <text x="920" y="22">AAA · FIRST</text>
    <text x="920" y="36">Fix-loop · Coverage</text>

    <text x="1080" y="22">OWASP · LLM Top 10</text>
    <text x="1080" y="36">SAST · SCA · Zero Trust</text>
  </g>

  <!-- ======================= Phase row ======================= -->

  <!-- Phase 1: BA (Design) -->
  <rect x="55" y="55" width="130" height="70" rx="10" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="120" y="87" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">BA</text>
  <text x="120" y="109" text-anchor="middle" font-size="13" fill="#047857">Why</text>

  <!-- Phase 2: RE (Design) -->
  <rect x="215" y="55" width="130" height="70" rx="10" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="280" y="87" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">RE</text>
  <text x="280" y="109" text-anchor="middle" font-size="13" fill="#047857">What</text>

  <!-- Phase 3: Arch (Design) -->
  <rect x="375" y="55" width="130" height="70" rx="10" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="87" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">Arch</text>
  <text x="440" y="109" text-anchor="middle" font-size="13" fill="#047857">How</text>

  <!-- Phase 4: Review (Handoff) -->
  <rect x="535" y="55" width="130" height="70" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="600" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Review</text>
  <text x="600" y="109" text-anchor="middle" font-size="13" fill="#c2410c">Handoff</text>

  <!-- Phase 5: Coding (Default agent) -->
  <rect x="695" y="55" width="130" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="760" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#374151">Coding</text>
  <text x="760" y="109" text-anchor="middle" font-size="11" fill="#6b7280">Default agent</text>

  <!-- Phase 6: Testing (Verify) -->
  <rect x="855" y="55" width="130" height="70" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="920" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">Testing</text>
  <text x="920" y="109" text-anchor="middle" font-size="13" fill="#6d28d9">UT + IT</text>

  <!-- Phase 7: Security (Secure) -->
  <rect x="1015" y="55" width="130" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1080" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Security</text>
  <text x="1080" y="109" text-anchor="middle" font-size="13" fill="#b91c1c">Audit</text>

  <!-- ======================= Main flow arrows ======================= -->

  <line x1="185" y1="90" x2="213" y2="90" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="90" x2="373" y2="90" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="90" x2="533" y2="90" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="90" x2="693" y2="90" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="90" x2="853" y2="90" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="985" y1="90" x2="1013" y2="90" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ======================= Phase to artifact connectors (all 7) ======================= -->

  <line x1="120" y1="125" x2="120" y2="150" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="280" y1="125" x2="280" y2="150" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="440" y1="125" x2="440" y2="150" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="600" y1="125" x2="600" y2="150" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="760" y1="125" x2="760" y2="150" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="920" y1="125" x2="920" y2="150" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="1080" y1="125" x2="1080" y2="150" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ======================= Artifact boxes (all 7 phases) ======================= -->

  <!-- BA artifact -->
  <rect x="65" y="150" width="110" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="120" y="183" text-anchor="middle" font-size="12" fill="#4b5563">BA doc</text>

  <!-- RE artifact -->
  <rect x="225" y="150" width="110" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#4b5563">Features</text>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#4b5563">Handoff</text>

  <!-- Arch artifact -->
  <rect x="385" y="150" width="110" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="440" y="174" text-anchor="middle" font-size="12" fill="#4b5563">ADRs · arc42</text>
  <text x="440" y="192" text-anchor="middle" font-size="12" fill="#4b5563">plan-context</text>

  <!-- Review artifact -->
  <rect x="545" y="150" width="110" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="600" y="174" text-anchor="middle" font-size="12" fill="#4b5563">Review notes</text>
  <text x="600" y="192" text-anchor="middle" font-size="12" fill="#4b5563">Writeback</text>

  <!-- Coding artifact -->
  <rect x="705" y="150" width="110" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="760" y="174" text-anchor="middle" font-size="12" fill="#4b5563">Source code</text>
  <text x="760" y="192" text-anchor="middle" font-size="12" fill="#4b5563">Bug log</text>

  <!-- Testing artifact -->
  <rect x="865" y="150" width="110" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="920" y="183" text-anchor="middle" font-size="12" fill="#4b5563">Test suites</text>

  <!-- Security artifact -->
  <rect x="1025" y="150" width="110" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="1080" y="183" text-anchor="middle" font-size="12" fill="#4b5563">Audit report</text>

  <!-- ======================= Fix loops (dashed curves below artifacts) ======================= -->

  <!-- Review sync: Review (600) back to Arch (440), curving below -->
  <path d="M 600 125 Q 520 380 440 125" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="520" y="288" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">Review sync</text>

  <!-- Test fix loop: Coding (760) to Testing (920) -->
  <path d="M 760 125 Q 840 395 920 125" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="840" y="298" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">Test fix loop</text>

  <!-- Security fix loop: Coding (760) to Security (1080) -->
  <path d="M 760 125 Q 920 440 1080 125" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="920" y="322" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">Security fix loop</text>

  <!-- ======================= Title + subtitle ======================= -->

  <text x="600" y="368" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">V-Model workflow for Claude Code</text>
  <text x="600" y="390" text-anchor="middle" font-size="12" fill="#6b7280">Structured AI skills from analysis to security audit, with fix loops and living documents</text>

  <!-- ======================= Legend ======================= -->

  <g font-size="11" fill="#374151">
    <rect x="135" y="425" width="14" height="14" rx="3" fill="#d1f4e8" stroke="#0d9488" stroke-width="1.5"/>
    <text x="155" y="436">Design</text>

    <rect x="235" y="425" width="14" height="14" rx="3" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="255" y="436">Handoff</text>

    <rect x="340" y="425" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="360" y="436">Default agent</text>

    <rect x="480" y="425" width="14" height="14" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="500" y="436">Verify</text>

    <rect x="570" y="425" width="14" height="14" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="590" y="436">Secure</text>

    <line x1="680" y1="432" x2="710" y2="432" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="716" y="436">Fix loops + artifact sync</text>
  </g>
</svg>
