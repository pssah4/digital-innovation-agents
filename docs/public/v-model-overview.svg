<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="vm-title vm-desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" preserveAspectRatio="xMidYMid meet">
  <title id="vm-title">V-Model workflow for AI coding assistants</title>
  <desc id="vm-desc">Horizontal flow through Business Analysis, Requirements Engineering, Architecture, Coding, Testing, and Security Audit. Each transition between phases is a handoff ritual. Each phase lists its key methods above and its produced artifacts below. Orthogonal dashed lines below the flow represent the test fix loop and security fix loop between Coding and Testing / Security.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ======================= Methods row (above phases) ======================= -->
  <g font-size="10" fill="#6b7280" text-anchor="middle">
    <text x="100" y="20">Exploration · Ideation</text>
    <text x="100" y="34">Validation</text>

    <text x="300" y="20">Epics · Features</text>
    <text x="300" y="34">Tech-agnostic SC</text>

    <text x="500" y="20">ADR (MADR)</text>
    <text x="500" y="34">arc42 · plan-context</text>

    <text x="700" y="20">TDD · Debugging</text>
    <text x="700" y="34">Verification gate</text>

    <text x="900" y="20">AAA · FIRST</text>
    <text x="900" y="34">Fix-loop · Coverage</text>

    <text x="1100" y="20">OWASP · LLM Top 10</text>
    <text x="1100" y="34">SAST · SCA · Zero Trust</text>
  </g>

  <!-- ======================= Phase row (6 phases, width 170, gap 30) ======================= -->

  <!-- Phase 1: Business Analysis -->
  <rect x="15" y="55" width="170" height="75" rx="10" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="100" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Business Analysis</text>
  <text x="100" y="112" text-anchor="middle" font-size="11" fill="#047857">Why</text>

  <!-- Phase 2: Requirements Engineering -->
  <rect x="215" y="55" width="170" height="75" rx="10" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="300" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Requirements Engineering</text>
  <text x="300" y="112" text-anchor="middle" font-size="11" fill="#047857">What</text>

  <!-- Phase 3: Architecture -->
  <rect x="415" y="55" width="170" height="75" rx="10" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="500" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Architecture</text>
  <text x="500" y="112" text-anchor="middle" font-size="11" fill="#047857">How</text>

  <!-- Phase 4: Coding -->
  <rect x="615" y="55" width="170" height="75" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="700" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Coding</text>
  <text x="700" y="112" text-anchor="middle" font-size="11" fill="#6b7280">Default agent</text>

  <!-- Phase 5: Testing -->
  <rect x="815" y="55" width="170" height="75" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="900" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Testing</text>
  <text x="900" y="112" text-anchor="middle" font-size="11" fill="#6d28d9">UT + IT</text>

  <!-- Phase 6: Security Audit -->
  <rect x="1015" y="55" width="170" height="75" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1100" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Security Audit</text>
  <text x="1100" y="112" text-anchor="middle" font-size="11" fill="#b91c1c">Findings</text>

  <!-- ======================= Main flow arrows (orange = Handoff at every transition) ======================= -->
  <line x1="187" y1="92" x2="211" y2="92" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="387" y1="92" x2="411" y2="92" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="587" y1="92" x2="611" y2="92" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="787" y1="92" x2="811" y2="92" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="987" y1="92" x2="1011" y2="92" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- ======================= Phase to artifact connectors ======================= -->
  <line x1="100" y1="130" x2="100" y2="155" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="300" y1="130" x2="300" y2="155" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="500" y1="130" x2="500" y2="155" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="700" y1="130" x2="700" y2="155" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="900" y1="130" x2="900" y2="155" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="1100" y1="130" x2="1100" y2="155" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ======================= Artifact boxes (all 6 phases, width 140, centered under phase) ======================= -->

  <rect x="30" y="155" width="140" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="100" y="187" text-anchor="middle" font-size="12" fill="#4b5563">BA doc</text>

  <rect x="230" y="155" width="140" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="300" y="178" text-anchor="middle" font-size="12" fill="#4b5563">Features</text>
  <text x="300" y="196" text-anchor="middle" font-size="12" fill="#4b5563">Handoff</text>

  <rect x="430" y="155" width="140" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="500" y="178" text-anchor="middle" font-size="12" fill="#4b5563">ADRs · arc42</text>
  <text x="500" y="196" text-anchor="middle" font-size="12" fill="#4b5563">plan-context</text>

  <rect x="630" y="155" width="140" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="700" y="178" text-anchor="middle" font-size="12" fill="#4b5563">Source code</text>
  <text x="700" y="196" text-anchor="middle" font-size="12" fill="#4b5563">Bug log</text>

  <rect x="830" y="155" width="140" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="900" y="187" text-anchor="middle" font-size="12" fill="#4b5563">Test suites</text>

  <rect x="1030" y="155" width="140" height="55" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="1100" y="187" text-anchor="middle" font-size="12" fill="#4b5563">Audit report</text>

  <!-- ======================= Fix loops (orthogonal, dashed, below artifacts) ======================= -->

  <!-- Test fix loop: Coding → Testing. Start at Coding phase right edge (outside Coding artifact), end at Testing phase left inside edge (outside Testing artifact). -->
  <path d="M 785 130 L 785 250 L 820 250 L 820 130" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="802" y="242" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">Test fix loop</text>

  <!-- Security fix loop: Coding → Security. Deeper corridor to avoid Test loop. -->
  <path d="M 785 130 L 785 290 L 1020 290 L 1020 130" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="902" y="282" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">Security fix loop</text>

  <!-- ======================= Title + subtitle ======================= -->
  <text x="600" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">V-Model workflow for AI coding assistants</text>
  <text x="600" y="367" text-anchor="middle" font-size="12" fill="#6b7280">Structured AI skills from analysis to security audit, with handoffs at every transition and living documents</text>

  <!-- ======================= Legend ======================= -->
  <g font-size="11" fill="#374151">
    <rect x="242" y="398" width="14" height="14" rx="3" fill="#d1f4e8" stroke="#0d9488" stroke-width="1.5"/>
    <text x="262" y="409">Design</text>

    <rect x="342" y="398" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="362" y="409">Default agent</text>

    <rect x="492" y="398" width="14" height="14" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="512" y="409">Verify</text>

    <rect x="592" y="398" width="14" height="14" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="612" y="409">Secure</text>

    <rect x="692" y="398" width="14" height="14" rx="3" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="712" y="409">Handoff</text>

    <line x1="812" y1="405" x2="832" y2="405" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="838" y="409">Fix loop</text>
  </g>
</svg>
