<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="vm-title vm-desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" preserveAspectRatio="xMidYMid meet">
  <title id="vm-title">V-Model workflow for AI coding assistants</title>
  <desc id="vm-desc">Horizontal flow through Business Analysis, Requirements Engineering, Architecture, Coding, Testing, and Security Audit. Methods listed above each phase, artifacts listed below each phase. Handoffs happen at every transition (orange arrows). Orthogonal dashed paths show the test fix loop between Coding and Testing and the security fix loop between Coding and Security.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ======================= Methods row (3 lines per phase, above phases) ======================= -->
  <g font-size="13" fill="#6b7280" text-anchor="middle">
    <!-- BA methods -->
    <text x="115" y="17">Users · needs · market</text>
    <text x="115" y="32">JTBD · Hypotheses</text>
    <text x="115" y="47">Pricing · Viability</text>

    <!-- RE methods -->
    <text x="345" y="17">Epic hypothesis (from HMW)</text>
    <text x="345" y="32">User stories (Func · Emot · Social)</text>
    <text x="345" y="47">Validation criteria</text>

    <!-- Arch methods -->
    <text x="560" y="17">ADR (MADR)</text>
    <text x="560" y="32">arc42</text>
    <text x="560" y="47">plan-context</text>

    <!-- Coding methods -->
    <text x="730" y="17">Codebase review</text>
    <text x="730" y="32">TDD · Debugging</text>
    <text x="730" y="47">Verification gate</text>

    <!-- Testing methods -->
    <text x="900" y="17">AAA · FIRST</text>
    <text x="900" y="32">Fix-loop</text>
    <text x="900" y="47">Coverage targets</text>

    <!-- Security methods -->
    <text x="1085" y="17">OWASP Top 10</text>
    <text x="1085" y="32">LLM · SAST · SCA</text>
    <text x="1085" y="47">Zero Trust</text>
  </g>

  <!-- ======================= Phase row (6 phases, variable widths, y=55, h=95) ======================= -->

  <!-- Phase 1: Business Analysis (w=180) -->
  <rect x="25" y="55" width="180" height="95" rx="12" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="115" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">Business Analysis</text>
  <text x="115" y="128" text-anchor="middle" font-size="13" fill="#047857">Why</text>

  <!-- Phase 2: Requirements Engineering (w=240) -->
  <rect x="225" y="55" width="240" height="95" rx="12" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="345" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">Requirements Engineering</text>
  <text x="345" y="128" text-anchor="middle" font-size="13" fill="#047857">What</text>

  <!-- Phase 3: Architecture (w=150) -->
  <rect x="485" y="55" width="150" height="95" rx="12" fill="#d1f4e8" stroke="#0d9488" stroke-width="2"/>
  <text x="560" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">Architecture</text>
  <text x="560" y="128" text-anchor="middle" font-size="13" fill="#047857">How</text>

  <!-- Phase 4: Coding (w=150) -->
  <rect x="655" y="55" width="150" height="95" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="730" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#374151">Coding</text>
  <text x="730" y="128" text-anchor="middle" font-size="13" fill="#6b7280">Default agent</text>

  <!-- Phase 5: Testing (w=150) -->
  <rect x="825" y="55" width="150" height="95" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="900" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#5b21b6">Testing</text>
  <text x="900" y="128" text-anchor="middle" font-size="13" fill="#6d28d9">UT + IT</text>

  <!-- Phase 6: Security Audit (w=180) -->
  <rect x="995" y="55" width="180" height="95" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1085" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">Security Audit</text>
  <text x="1085" y="128" text-anchor="middle" font-size="13" fill="#b91c1c">OWASP audit</text>

  <!-- ======================= Main flow arrows (orange = Handoff at every transition) ======================= -->
  <line x1="207" y1="103" x2="221" y2="103" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <line x1="467" y1="103" x2="481" y2="103" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <line x1="637" y1="103" x2="651" y2="103" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <line x1="807" y1="103" x2="821" y2="103" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <line x1="977" y1="103" x2="991" y2="103" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- ======================= Phase to artifact connectors ======================= -->
  <line x1="115" y1="150" x2="115" y2="165" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="345" y1="150" x2="345" y2="165" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="560" y1="150" x2="560" y2="165" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="730" y1="150" x2="730" y2="165" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="900" y1="150" x2="900" y2="165" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="1085" y1="150" x2="1085" y2="165" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ======================= Artifact boxes (all 6 phases, 2 lines each) ======================= -->

  <!-- BA artifact: w=160 -->
  <rect x="35" y="165" width="160" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="115" y="186" text-anchor="middle" font-size="14" fill="#4b5563">BA doc</text>
  <text x="115" y="206" text-anchor="middle" font-size="14" fill="#4b5563">Exploration board</text>

  <!-- RE artifact: w=220 -->
  <rect x="235" y="165" width="220" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="345" y="186" text-anchor="middle" font-size="14" fill="#4b5563">Epics · Features</text>
  <text x="345" y="206" text-anchor="middle" font-size="14" fill="#4b5563">Backlog · Handoff</text>

  <!-- Arch artifact: w=130 -->
  <rect x="495" y="165" width="130" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="560" y="186" text-anchor="middle" font-size="14" fill="#4b5563">ADRs · arc42</text>
  <text x="560" y="206" text-anchor="middle" font-size="14" fill="#4b5563">plan-context</text>

  <!-- Coding artifact: w=130 -->
  <rect x="665" y="165" width="130" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="730" y="186" text-anchor="middle" font-size="14" fill="#4b5563">Source code</text>
  <text x="730" y="206" text-anchor="middle" font-size="14" fill="#4b5563">Bug log</text>

  <!-- Testing artifact: w=130 -->
  <rect x="835" y="165" width="130" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="900" y="186" text-anchor="middle" font-size="14" fill="#4b5563">Test suites</text>
  <text x="900" y="206" text-anchor="middle" font-size="14" fill="#4b5563">Coverage</text>

  <!-- Security artifact: w=160 -->
  <rect x="1005" y="165" width="160" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="1085" y="186" text-anchor="middle" font-size="14" fill="#4b5563">Audit report</text>
  <text x="1085" y="206" text-anchor="middle" font-size="14" fill="#4b5563">Backlog updates</text>

  <!-- ======================= Fix loops (orthogonal, dashed, below artifacts) ======================= -->

  <!-- Test fix loop: from Coding right-inside to Testing left-inside (tight U next to main flow arrow) -->
  <path d="M 803 150 L 803 260 L 828 260 L 828 150" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="720" y="285" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7280">Test fix loop</text>

  <!-- Security fix loop: longer path from Coding to Security, below the Test fix loop -->
  <path d="M 800 150 L 800 315 L 1000 315 L 1000 150" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-dashed)"/>
  <text x="900" y="340" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7280">Security fix loop</text>

  <!-- ======================= Title + subtitle ======================= -->
  <text x="600" y="395" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">V-Model workflow for AI coding assistants</text>
  <text x="600" y="418" text-anchor="middle" font-size="13" fill="#6b7280">Structured AI skills from analysis to security audit, with handoffs at every transition and living documents</text>

  <!-- ======================= Legend ======================= -->
  <g font-size="13" fill="#374151">
    <rect x="210" y="450" width="16" height="16" rx="3" fill="#d1f4e8" stroke="#0d9488" stroke-width="1.5"/>
    <text x="232" y="463">Design</text>

    <rect x="310" y="450" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="332" y="463">Default agent</text>

    <rect x="460" y="450" width="16" height="16" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="482" y="463">Verify</text>

    <rect x="555" y="450" width="16" height="16" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="577" y="463">Secure</text>

    <rect x="655" y="450" width="16" height="16" rx="3" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="677" y="463">Handoff at every transition</text>

    <line x1="880" y1="458" x2="905" y2="458" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="911" y="463">Fix loop</text>
  </g>
</svg>
