  <rect x="234" y="250" width="160" height="65" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="314" y="276" text-anchor="middle" font-size="15" fill="#475569">Epics · Features</text>
